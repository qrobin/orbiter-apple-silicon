name: Upstream Windows build (manual)

on:
  workflow_dispatch:

jobs:
  build:
    name: Push
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
        os: [windows-2022]
    uses: ./.github/workflows/reusable-build.yml
    with:
      os: ${{ matrix.os }}
      architecture: ${{ matrix.architecture }}
